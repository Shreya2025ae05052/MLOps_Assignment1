# Step 7 - Kubernetes deployment of the heart disease API
# Usage: kubectl apply -f k8s/api-deployment.yaml

# Deployment: keeps 2 copies (pods) of the API container running
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heart-api
  template:
    metadata:
      labels:
        app: heart-api
    spec:
      containers:
        - name: heart-api
          image: heart-api:v1
          imagePullPolicy: Never   # uses the image built on this computer
          ports:
            - containerPort: 8000
          readinessProbe:          # traffic is sent only after /health answers
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# LoadBalancer service: one address for both pods -> http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: heart-api-service
spec:
  type: LoadBalancer
  selector:
    app: heart-api
  ports:
    - port: 8080
      targetPort: 8000
---
# Headless service: lets Prometheus find and scrape each pod separately
apiVersion: v1
kind: Service
metadata:
  name: heart-api-headless
spec:
  clusterIP: None
  selector:
    app: heart-api
  ports:
    - port: 8000
      targetPort: 8000
